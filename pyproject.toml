[project]
name = "home-energy-helper"
version = "0.1.0"
description = "A Streamlit assistant for comparing household electricity bills and finding source-backed energy-saving guidance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minsearch>=0.2.0",
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.49.0",
    "pydf>=12",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
